# Copy this file to edc-demo.local.properties and replace the placeholder values.
# The runtime is started with -Dedc.fs.config=<path-to-this-file>.

edc.hostname=localhost
edc.participant.id=did:web:edc-demo.local:BPNL000000000001

web.http.default.port=8180
web.http.default.path=/api
web.http.management.port=8181
web.http.management.path=/management
web.http.management.auth.key=change-me
web.http.control.port=8182
web.http.control.path=/control
web.http.protocol.port=8282
web.http.protocol.path=/api/v1/dsp
web.http.catalog.port=8185
web.http.catalog.path=/catalog

edc.datasource.default.url=jdbc:postgresql://localhost:5432/edc
edc.datasource.default.user=edc
edc.datasource.default.password=change-me

edc.vault.hashicorp.url=http://localhost:8200
edc.vault.hashicorp.token=root
edc.vault.hashicorp.timeout.seconds=30
edc.vault.hashicorp.health.check.enabled=true
edc.vault.hashicorp.health.check.standby.ok=true
edc.vault.hashicorp.api.secret.path=/v1/secret
edc.vault.hashicorp.api.health.check.path=/v1/sys/health

tx.edc.vault.secrets=participant||client-secret:change-me

edc.registry=http://localhost:8181/registry
edc.reconciler.interval.seconds=60
edc.reconciler.initial.delay.seconds=10
