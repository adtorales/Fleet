name: Build and Publish TAP 7.4 Fleet

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  fleet:
    name: Build Fleet and Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify Fleet
        run: ./gradlew build
      - name: Publish Maven artifacts
        if: github.event_name != 'pull_request'
        run: >-
          ./gradlew publishAllPublicationsToGitHubPackagesRepository
          -PgithubPackagesOwner=${{ github.repository_owner }}
          -PgithubPackagesRepo=${{ github.event.repository.name }}
          -PgithubPackagesUsername=${{ github.actor }}
          -PgithubPackagesToken=${{ secrets.GITHUB_TOKEN }}
      - name: Build Registry launcher
        run: ./gradlew :registry:launcher:shadowJar
      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Registry image metadata
        if: github.event_name != 'pull_request'
        id: registry-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/tap74-registry
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=current
            type=raw,value=${{ github.run_number }}
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=tap74-registry
      - name: Build and push Registry image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./registry/launcher
          file: ./registry/launcher/Dockerfile
          push: true
          tags: ${{ steps.registry-meta.outputs.tags }}
          labels: ${{ steps.registry-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Package and publish Registry Helm chart
        if: github.event_name != 'pull_request'
        run: |
          helm package registry/tap74-registry --destination .helm
          helm push .helm/tap74-registry-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  edc-demo:
    name: Build demo connector
    needs: fleet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Build demo connector
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./edc-demo/gradlew -p edc-demo :launchers:edc-demo:shadowJar
      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Connector image metadata
        if: github.event_name != 'pull_request'
        id: demo-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/edc-demo
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=current
            type=raw,value=${{ github.run_number }}
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=edc-demo
      - name: Build and push connector image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./edc-demo/launchers/edc-demo
          file: ./edc-demo/launchers/edc-demo/Dockerfile
          push: true
          tags: ${{ steps.demo-meta.outputs.tags }}
          labels: ${{ steps.demo-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
